<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tennis Star</title>
</head>

<body>

    <main class="game-container">

        <h1>TENNIS STAR</h1>

        <p class="description">
            Move your player and enjoy tennis!
        </p>

        <canvas
            id="gameCanvas"
            width="800"
            height="500">
        </canvas>

        <div class="controls">
            <h2>CONTROLS</h2>

            <p>↑ ↓ ← → : Move</p>
            <p>W A S D : Move</p>
        </div>

    </main>

    <script type="module" src="/src/main.js"></script>

</body>

</html>
